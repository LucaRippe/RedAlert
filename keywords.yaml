# Keyword-Konfiguration fuer den Reddit-Listener.
#
# Jeder Eintrag ist eine Gruppe. Ein Treffer entsteht, wenn IRGENDEINE Phrase aus
# `match_any` als Teilstring im Text vorkommt (Titel+Body bei Posts, Body bei
# Kommentaren) UND KEINE Phrase aus `exclude_any` vorkommt.
#
# - match_any: Liste von Phrasen, mindestens eine muss treffen (Teilstring, nicht
#   nur ganzes Wort)
# - exclude_any: optional, Phrasen die den Treffer unterdruecken auch wenn match_any
#   getroffen hat
# - case_sensitive: optional, Standard false (Gross-/Kleinschreibung wird ignoriert)
#
# Diese Datei kannst du beliebig erweitern, ohne Code anzufassen - einfach neue
# Eintraege nach demselben Muster hinzufuegen.
#
# Kurzform fuer einzelne Ad-hoc-Keywords: statt einer vollen Gruppe reicht auch
# einfach ein nackter String als Eintrag, z. B. "reference manager". Der wird
# automatisch zu einer eigenen Gruppe (Name = die Phrase selbst, match_any = nur
# diese eine Phrase, kein exclude_any, case-insensitiv). Praktisch zum schnellen
# Ausprobieren einzelner Woerter, ohne die name/match_any-Struktur auszufuellen.
# Siehe Ad-hoc-Block ganz unten in dieser Datei.

# --- Konkrete Konkurrenz-Alternativen -------------------------------------

- name: "Litmaps Alternative"
  match_any:
    - "litmaps alternative"
    - "alternative to litmaps"

- name: "ResearchRabbit Alternative"
  match_any:
    - "researchrabbit alternative"
    - "research rabbit alternative"
    - "alternative to researchrabbit"
    - "alternative to research rabbit"

